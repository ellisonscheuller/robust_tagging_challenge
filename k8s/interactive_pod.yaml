apiVersion: v1
kind: Pod
metadata:
  name: robust-tagging-dev
  namespace: axol1tl
spec:
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
        - matchExpressions:
          - key: nvidia.com/gpu.product
            operator: In
            values:
              - "Tesla-V100-SXM2-32GB"
              - "NVIDIA-A100-PCIE-40GB"
              - "NVIDIA-RTX-A6000"
  containers:
  - name: dev
    # Build and push from repo root:
    #   docker build -t <registry>/robust-tagging:latest .
    #   docker push <registry>/robust-tagging:latest
    image: REPLACE_ME/robust-tagging:latest
    command: ["sleep", "infinity"]
    env:
      - name: WANDB_API_KEY
        valueFrom:
          secretKeyRef:
            name: wandb-secrets
            key: WANDB_API_KEY
    resources:
      limits:
        nvidia.com/gpu: 1
        memory: 32Gi
        cpu: 8
      requests:
        nvidia.com/gpu: 1
        memory: 32Gi
        cpu: 8
    volumeMounts:
    - mountPath: /workspace
      name: robust-tagging
  restartPolicy: Never
  volumes:
    - name: robust-tagging
      persistentVolumeClaim:
        claimName: robust-tagging-pvc
