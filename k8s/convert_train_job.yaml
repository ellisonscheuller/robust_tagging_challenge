apiVersion: batch/v1
kind: Job
metadata:
  name: robust-tagging-convert-train
  namespace: fastml26-hackathon
spec:
  backoffLimit: 0
  template:
    spec:
      containers:
      - name: convert
        # TODO: switch to the custom registry.nrp-nautilus.io/fastml26-hackathon/challenge3
        # image once that registry situation is sorted out. For now, use the public base
        # image and install everything at runtime.
        image: pytorch/pytorch:2.1.0-cuda11.8-cudnn8-runtime
        command: ["/bin/bash", "-c"]
        args:
          - |
            set -e
            echo "=== Job started: $(date) ==="

            cd /hackathon-data/C9_robust_tagging/escheuller-dev
            pip install --quiet -e . awkward pyarrow tqdm

            echo "=== Conversion (train, SM backgrounds, 4-class): $(date) ==="
            python converterHLT.py --config configs/data_config_collide1m.yaml
        resources:
          limits:
            memory: 120Gi
            cpu: 8
          requests:
            memory: 120Gi
            cpu: 8
        volumeMounts:
        - mountPath: /hackathon-data
          name: hackathon-data
      restartPolicy: Never
      volumes:
        - name: hackathon-data
          persistentVolumeClaim:
            claimName: hackathon-data
