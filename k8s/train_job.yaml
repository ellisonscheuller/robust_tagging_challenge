apiVersion: batch/v1
kind: Job
metadata:
  name: robust-tagging-train
  namespace: axol1tl
spec:
  template:
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: nvidia.com/gpu.product
                operator: In
                values:
                  - "Tesla-V100-SXM2-32GB"
                  - "NVIDIA-A100-PCIE-40GB"
                  - "NVIDIA-RTX-A6000"
      containers:
      - name: train
        # Build and push from repo root:
        #   docker build -t <registry>/robust-tagging:latest .
        #   docker push <registry>/robust-tagging:latest
        image: REPLACE_ME/robust-tagging:latest
        command: ["/bin/bash", "-c"]
        args:
          - |
            set -e
            echo "Pulling latest code..."
            git clone https://${GIT_USER}:${GIT_TOKEN}@github.com/ellisonscheuller/robust_tagging_challenge.git /tmp/repo
            cd /tmp/repo
            pip install --no-cache-dir -q .

            echo "Starting training..."
            # NOTE: --degraded_data will be removed once Arianna's on-the-fly
            # degradation is integrated. For now train.py still requires it.
            python train.py \
              --data_cfg=/workspace/configs/data_config.yaml \
              --train_cfg=/workspace/configs/train_config.yaml \
              --data=/workspace/data/nominal_train.pt \
              --outdir=/workspace/checkpoints
        env:
          - name: WANDB_API_KEY
            valueFrom:
              secretKeyRef:
                name: wandb-secrets
                key: WANDB_API_KEY
          - name: GIT_TOKEN
            valueFrom:
              secretKeyRef:
                name: github-secrets
                key: GIT_TOKEN
          - name: GIT_USER
            valueFrom:
              secretKeyRef:
                name: github-secrets
                key: GIT_USER
        resources:
          limits:
            nvidia.com/gpu: 1
            memory: 32Gi
            cpu: 8
          requests:
            nvidia.com/gpu: 1
            memory: 32Gi
            cpu: 8
        volumeMounts:
        - mountPath: /workspace
          name: robust-tagging
      restartPolicy: OnFailure
      volumes:
        - name: robust-tagging
          persistentVolumeClaim:
            claimName: robust-tagging-pvc
  backoffLimit: 2
