apiVersion: batch/v1
kind: Job
metadata:
  name: robust-tagging-train
  namespace: fastml26-hackathon
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: train
        image: gitlab-registry.nrp-nautilus.io/escheuller/robust_tagging_challenge:latest
        command: ["/bin/bash", "-c"]
        args:
          - |
            set -e
            echo "=== Job started: $(date) ==="
            python -c "import torch; print('CUDA:', torch.cuda.is_available(), '| Device:', torch.cuda.get_device_name(0) if torch.cuda.is_available() else 'cpu')"

            cd /hackathon-data/C9_robust_tagging/escheuller-dev
            pip install --quiet -e .

            export PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True

            OUTDIR=/hackathon-data/C9_robust_tagging/checkpoints
            mkdir -p "$OUTDIR"

            echo "=== Training: $(date) ==="
            python train.py \
              --data_cfg  configs/data_config_collide1m.yaml \
              --train_cfg configs/train_config.yaml \
              --data      /hackathon-data/C9_robust_tagging/pt_files/robust_tagging_train_data.pt \
              --outdir    "$OUTDIR"
        env:
          # Create the secret once (see comment at bottom of this file):
          #   kubectl -n fastml26-hackathon create secret generic wandb-secrets \
          #     --from-literal=WANDB_API_KEY=<key>
          - name: WANDB_API_KEY
            valueFrom:
              secretKeyRef:
                name: wandb-secrets
                key: WANDB_API_KEY
          - name: WANDB_MODE
            value: online
        resources:
          limits:
            nvidia.com/gpu: 1
            memory: 40Gi
            cpu: 4
          requests:
            nvidia.com/gpu: 1
            memory: 40Gi
            cpu: 4
        volumeMounts:
        - mountPath: /hackathon-data
          name: hackathon-data
      volumes:
        - name: hackathon-data
          persistentVolumeClaim:
            claimName: hackathon-data
