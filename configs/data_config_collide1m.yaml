ds_name: robust_tagging_train_data

data_processing:
  source: collide1m
  sample_dir: /hackathon-data/C9_robust_tagging/train
  out_path: /hackathon-data/C9_robust_tagging/pt_files
  pfcands: true
  n_objects: 400
  sort_by_pt: true
  sk_spacing: null
  nevents_per_class: -1   # keep every available event per class

  samples:
    - QCD:
      - QCD_HT50toInf
    - DY:
      - DYJetsToLL_13TeV-madgraphMLM-pythia8
    - TT:
      - tt0123j_5f_ckm_LO_MLM_leptonic
      - tt0123j_5f_ckm_LO_MLM_hadronic
      - tt0123j_5f_ckm_LO_MLM_semiLeptonic
    - WJets:
      - WJetsToLNu_13TeV-madgraphMLM-pythia8
