ds_name: robust_tagging_eval_public

data_processing:
  source: collide1m
  sample_dir: /robust-tagging/collide-1m   # on PVC: /workspace/collide-1m
  out_path: /robust-tagging/preprocessed_data
  pfcands: true
  n_objects: 400
  sort_by_pt: true
  sk_spacing: null
  nevents_per_class: 50000

  # Binary labels: background = 0, signal = 1.
  # This is the public eval set — HH->4b signal, participants can test on this.
  samples:
    - background:
      - QCD_HT50toInf
      - DYJetsToLL_13TeV-madgraphMLM-pythia8
      - tt0123j_5f_ckm_LO_MLM_leptonic
      - tt0123j_5f_ckm_LO_MLM_hadronic
      - tt0123j_5f_ckm_LO_MLM_semiLeptonic
      - WJetsToLNu_13TeV-madgraphMLM-pythia8
    - signal:
      - HH_4b
